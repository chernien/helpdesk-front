<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 120" width="430" height="120" role="img" aria-label="Help Desk Mediasoft">
  <defs>
    <linearGradient id="hdBlueFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FADE4"/>
      <stop offset="1" stop-color="#2E7DB8"/>
    </linearGradient>
  </defs>

  <!-- ===== Icone ===== -->
  <g transform="translate(6 20) scale(1.25)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#hdBlueFull)"/>
    <path d="M20 15h18l8 8v17a7 7 0 0 1-7 7H31l-9 7v-7h-2a7 7 0 0 1-7-7V22a7 7 0 0 1 7-7z" fill="#FFFFFF"/>
    <path d="M38 15l8 8h-8z" fill="#C9E3F7"/>
    <path d="M23 31.5l5.5 5.5L41 24.5" fill="none" stroke="#1F2937" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== Wordmark (ombre noire decalee, comme le logo mediasoft) ===== -->
  <g font-family="Poppins, Montserrat, 'Segoe UI', system-ui, sans-serif" font-weight="700">
    <text x="115" y="63" font-size="46" fill="#111111">helpdesk</text>
    <text x="112" y="60" font-size="46" fill="#4A9FDC">helpdesk</text>
  </g>

  <!-- ===== Bandeaux (echo de "Integration Informatique") ===== -->
  <rect x="113" y="76" width="106" height="26" fill="#C4C4C4"/>
  <rect x="219" y="76" width="118" height="26" fill="#808080"/>
  <g font-family="Poppins, Montserrat, 'Segoe UI', system-ui, sans-serif" font-weight="600"
     font-size="15" letter-spacing="0.6" text-anchor="middle">
    <text x="166" y="94" fill="#111111">Support</text>
    <text x="278" y="94" fill="#FFFFFF">Assistance</text>
  </g>
</svg>
